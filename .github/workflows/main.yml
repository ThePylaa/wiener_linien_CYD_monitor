name: Build Arduino Sketch

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          # ESP32-2432S028R "Cheap Yellow Display" is a plain ESP32-WROOM board.
          # The sketch needs the "Huge APP" partition (it exceeds the default
          # 1.2 MB app partition).
          fqbn: "esp32:esp32:esp32:PartitionScheme=huge_app"
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: ArduinoJson
            - name: TFT_eSPI
            - name: WiFiManager
            - name: XPT2046_Touchscreen
          sketch-paths: |
            - sketch
